; Plataforma principal: ESP32 (FreeRTOS / ESP-IDF 6.0.1)
; Compilar e gravar:  powershell -File esp32\build.ps1 -Upload [-Demo]   (copia para C:\str_m3_esp32)
; Capturar:           python esp32\capture.py COM3 <nome>
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv

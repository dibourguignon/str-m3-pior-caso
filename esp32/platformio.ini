; Plataforma principal: ESP32 (FreeRTOS / ESP-IDF 6.0.1)
;
; Abrir ESTA pasta (esp32/) no VS Code com PlatformIO. O caminho NAO pode ter
; espacos (limitacao do ESP-IDF): por exemplo C:\str-m3-pior-caso\esp32.
; A tarefa Huffman vem de ../src/huffman.c (mesmo codigo da plataforma Linux).
;
; Ambientes:
;   demo     (padrao) 1.000 ativacoes por etapa, ~45 s  -> botoes Build/Upload do PlatformIO
;   campanha          10.000 / 3.000 / 10.000 / 10.000, ~6 min (dados do relatorio)
; Depois de gravar, rodar a captura (gera o estresse UART da etapa 4 e o resumo):
;   python ../esp32/capture.py COM3 defesa      (a partir da raiz do repositorio)

[platformio]
default_envs = demo

[env]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv

[env:demo]
build_flags = -DDEMO

[env:campanha]
